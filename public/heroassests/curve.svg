<!-- curve.svg -->
<svg
    width="180"
    height="220"
    viewBox="0 0 180 220"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
>
    <defs>
        <linearGradient
            id="curveGradient"
            x1="25"
            y1="205"
            x2="165"
            y2="15"
            gradientUnits="userSpaceOnUse"
        >
            <stop offset="0%" stop-color="#159447"/>
            <stop offset="100%" stop-color="#087A43"/>
        </linearGradient>
    </defs>

    <!--
        Curved / looping flight path
        Designed to sit underneath or beside paper-plane.svg
    -->
    <path
        d="
        M 24 205

        C 47 184,
          65 161,
          67 137

        C 69 118,
          57 106,
          43 108

        C 27 110,
          23 127,
          32 137

        C 42 148,
          61 143,
          76 131

        C 97 114,
          106 90,
          115 65

        C 125 39,
          141 23,
          163 17
        "
        stroke="url(#curveGradient)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-dasharray="8 9"
        fill="none"
    />

    <!-- Tiny end accent -->
    <circle
        cx="163"
        cy="17"
        r="2.5"
        fill="#159447"
    />
</svg>
