<!-- green-ring.svg -->
<svg
width="600"
height="600"
viewBox="0 0 600 600"
fill="none"
xmlns="http://www.w3.org/2000/svg"
>
<defs>
<linearGradient
id="ringGradient"
x1="110"
y1="80"
x2="500"
y2="520"
gradientUnits="userSpaceOnUse"
>
<stop offset="0%" stop-color="#39C96B"/>
<stop offset="48%" stop-color="#18A955"/>
<stop offset="100%" stop-color="#078242"/>
</linearGradient>
<linearGradient
id="ringHighlight"
x1="180"
y1="100"
x2="430"
y2="490"
gradientUnits="userSpaceOnUse"
>
<stop offset="0%" stop-color="#63DA86"/>
<stop offset="100%" stop-color="#159447"/>
</linearGradient>
</defs>
<!--
Main broken circular ring.
Opening intentionally placed on the right side.
-->
<path
d="
M 432 104
C 366 63,
281 54,
208 83
C 135 112,
83 174,
65 248
C 47 323,
67 403,
119 462
C 170 521,
247 550,
324 539
C 401 528,
467 479,
501 410
"
stroke="url(#ringGradient)"
stroke-width="92"
stroke-linecap="round"
fill="none"
/>
<!-- Upper-right short segment -->
<path
d="
M 432 104
C 464 125,
488 150,
507 180
"
stroke="url(#ringHighlight)"
stroke-width="92"
stroke-linecap="round"
fill="none"
/>
<!-- Lower-right short segment -->
<path
d="
M 501 410
C 518 375,
527 341,
529 307
"
stroke="url(#ringGradient)"
stroke-width="92"
stroke-linecap="round"
fill="none"
/>
</svg>
