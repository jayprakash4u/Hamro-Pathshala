<!-- orange-dot.svg -->
<svg
width="60"
height="60"
viewBox="0 0 60 60"
fill="none"
xmlns="http://www.w3.org/2000/svg"
>
<defs>
<radialGradient
id="orangeDotGradient"
cx="0"
cy="0"
r="1"
gradientUnits="userSpaceOnUse"
gradientTransform="translate(21 18) rotate(45) scale(45)"
>
<stop
offset="0%"
stop-color="#FFD98A"
/>
<stop
offset="45%"
stop-color="#FFB84D"
/>
<stop
offset="100%"
stop-color="#F28C28"
/>
</radialGradient>
</defs>
<!-- Main orange dot -->
<circle
cx="30"
cy="30"
r="18"
fill="url(#orangeDotGradient)"
/>
<!-- Soft highlight -->
<ellipse
cx="24"
cy="23"
rx="6"
ry="4"
transform="rotate(-35 24 23)"
fill="#FFFFFF"
opacity="0.35"
/>
</svg>
