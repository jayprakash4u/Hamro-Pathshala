<!-- dots.svg -->
<svg
width="120"
height="120"
viewBox="0 0 120 120"
fill="none"
xmlns="http://www.w3.org/2000/svg"
>
<defs>
<linearGradient
id="dotGradient"
x1="10"
y1="10"
x2="110"
y2="110"
gradientUnits="userSpaceOnUse"
>
<stop offset="0%" stop-color="#8ADDB0"/>
<stop offset="100%" stop-color="#32B977"/>
</linearGradient>
</defs>
<!-- Row 1 -->
<circle cx="12" cy="12" r="4.5" fill="url(#dotGradient)"/>
<circle cx="36" cy="12" r="4.5" fill="url(#dotGradient)"/>
<circle cx="60" cy="12" r="4.5" fill="url(#dotGradient)"/>
<circle cx="84" cy="12" r="4.5" fill="url(#dotGradient)"/>
<circle cx="108" cy="12" r="4.5" fill="url(#dotGradient)"/>
