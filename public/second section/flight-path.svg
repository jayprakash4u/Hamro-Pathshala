<!-- flight-path.svg -->
<svg
width="260"
height="180"
viewBox="0 0 260 180"
fill="none"
xmlns="http://www.w3.org/2000/svg"
>
<defs>
<linearGradient
id="flightGradient"
x1="20"
y1="165"
x2="245"
y2="20"
gradientUnits="userSpaceOnUse"
>
<stop offset="0%" stop-color="#8BD7AD"/>
<stop offset="55%" stop-color="#35B875"/>
<stop offset="100%" stop-color="#159447"/>
</linearGradient>
</defs>
<!-- Main curved flight trail -->
<path
d="
M 18 162
C 42 147,
57 129,
60 111
C 63 94,
52 82,
38 84
C 24 86,
20 100,
28 110
C 38 122,
58 118,
78 105
C 102 89,
118 67,
142 53
C 169 37,
200 29,
240 22
"
stroke="url(#flightGradient)"
stroke-width="3.5"
stroke-linecap="round"
stroke-linejoin="round"
stroke-dasharray="7 10"
fill="none"
/>
<!-- Starting point -->
<circle
cx="18"
cy="162"
r="3.5"
fill="#8BD7AD"
opacity="0.8"
/>
</svg>
