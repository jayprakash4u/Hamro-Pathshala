<!-- check-circle.svg -->
<svg
width="48"
height="48"
viewBox="0 0 48 48"
fill="none"
xmlns="http://www.w3.org/2000/svg"
>
<defs>
<linearGradient
id="checkCircleGradient"
x1="8"
y1="6"
x2="40"
y2="42"
gradientUnits="userSpaceOnUse"
>
<stop offset="0%" stop-color="#29BC68"/>
<stop offset="100%" stop-color="#078242"/>
</linearGradient>
</defs>
<!-- Soft outer background -->
<circle
cx="24"
cy="24"
r="21"
fill="#EAF7EF"
/>
<!-- Main green circle -->
<circle
cx="24"
cy="24"
r="15"
fill="url(#checkCircleGradient)"
/>
<!-- Check -->
<path
d="M16.5 24.5L21.5 29.5L31.8 18.5"
stroke="white"
stroke-width="3.2"
stroke-linecap="round"
stroke-linejoin="round"
/>
</svg>
